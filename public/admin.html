<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio Admin</title>
    <link rel="stylesheet" href="/styles.css?v=hero-intro-current">
  </head>
  <body class="admin-page locked">
    <section class="login-screen" id="loginScreen">
      <form class="login-card" id="loginForm">
        <p class="eyebrow">Admin Login</p>
        <h1>管理员登录</h1>
        <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button primary wide" type="submit">进入后台</button>
        <p class="login-error" id="loginError"></p>
      </form>
    </section>

    <div class="admin-app" id="adminApp" hidden>
      <header class="topbar">
        <a class="brand" href="/">Portfolio Admin</a>
        <nav>
          <a href="/">前台</a>
          <button class="nav-button" id="saveBtn">保存</button>
          <button class="nav-button" id="exportBtn">导出 JSON</button>
          <button class="nav-button" id="logoutBtn">退出</button>
        </nav>
      </header>

      <main class="admin-shell">
        <aside class="admin-list">
          <div class="admin-tabs">
            <button class="active" type="button" data-mode="projects">作品</button>
            <button type="button" data-mode="articles">文章</button>
            <button type="button" data-mode="gallery">图库</button>
            <button type="button" data-mode="settings">设置</button>
          </div>

          <section id="contentSidebar">
            <button class="button primary wide" id="addItemBtn" type="button">新增</button>
            <div id="itemList"></div>
          </section>

          <section id="gallerySidebar" hidden>
            <label class="gallery-search">
              <span>搜索图库</span>
              <input id="gallerySearchInput" type="search" placeholder="搜索文件名 / 路径 / 章节">
            </label>
            <p class="sidebar-label">用途筛选</p>
            <div class="gallery-usage-filter" id="galleryUsageFilter"></div>
            <p class="sidebar-label">图库章节</p>
            <div id="galleryFilter"></div>
            <div class="asset-tools gallery-upload-tools">
              <label class="button primary wide file-pick">上传图库图片<input id="galleryInput" type="file" accept="image/*" multiple></label>
              <button class="button ghost wide" id="selectChapterGalleryBtn" type="button">全选当前章节</button>
              <button class="button ghost wide" id="clearGallerySelectionBtn" type="button">取消全部已选</button>
              <button class="button ghost danger wide" id="deleteSelectedGalleryBtn" type="button">删除选中图片</button>
            </div>
            <p class="selection-note" id="gallerySelectionNote">已选择 0 张图片</p>
          </section>
        </aside>

        <section class="editor">
          <div class="editor-head">
            <p class="eyebrow" id="editorMode">Content Editor</p>
            <h1 id="editorTitle">选择内容</h1>
          </div>

          <form id="projectForm" class="form-grid">
            <label>作品标题<input name="title"></label>
            <label>类别<input name="category"></label>
            <label>文件分类<input name="group"></label>
            <label>年份<input name="year"></label>
            <label>角色<input name="role"></label>
            <label class="full">简介<textarea name="summary" rows="4"></textarea></label>
            <label class="full">标签，以逗号分隔<input name="tags"></label>
            <label>排序<input name="order" type="number" min="0"></label>
            <label class="check"><input name="hidden" type="checkbox"> 隐藏这个项目</label>
          </form>

          <form id="articleForm" class="form-grid" hidden>
            <label>文章标题<input name="title"></label>
            <label>发布日期<input name="date" type="date"></label>
            <label>分类<input name="category"></label>
            <label class="check"><input name="published" type="checkbox"> 前台发布</label>
            <label class="full">摘要<textarea name="excerpt" rows="3"></textarea></label>
            <label class="full">正文<textarea name="content" rows="12"></textarea></label>
            <label class="full">封面图片路径<input name="cover" placeholder="/assets/uploads/example.jpg"></label>
          </form>

          <form id="settingsForm" class="form-grid" hidden>
            <label>Banner 大图路径<input name="heroImage" placeholder="/assets/uploads/banner.jpg"></label>
            <label>联系邮箱<input name="email"></label>
            <label>电话<input name="phone"></label>
            <label>微信号<input name="wechat"></label>
            <label class="full">联系模块标题<textarea name="contactTitle" rows="3"></textarea></label>
            <label class="full">联系模块说明<textarea name="contactBody" rows="3"></textarea></label>
            <label>微信二维码路径<input name="qrImage" placeholder="/assets/uploads/wechat.jpg"></label>
            <label class="full">联系模块备注<input name="contactNote"></label>
          </form>

          <section id="galleryPanel" hidden>
            <div class="gallery-workspace" id="galleryWorkspace">
              <div class="chapter-admin-panel">
                <div class="chapter-admin-fields">
                  <label>章节编号<input id="chapterIndexInput" placeholder="01"></label>
                  <label>章节名称<input id="chapterTitleInput" placeholder="品牌系统设计"></label>
                  <label>英文副标题<input id="chapterSubtitleInput" placeholder="Brand System Design"></label>
                </div>
                <div class="chapter-admin-actions">
                  <button class="button ghost" id="saveChapterBtn" type="button">保存章节</button>
                  <button class="button ghost" id="addChapterBtn" type="button">新增章节</button>
                  <button class="button ghost danger" id="deleteChapterBtn" type="button">删除章节</button>
                </div>
              </div>
              <div class="gallery-selection-bar" id="gallerySelectionBar">
                <strong>已选择 0 张图片</strong>
                <span>点击图片可选择或取消选择，拖动图片可调整排序。</span>
              </div>
              <div class="gallery-admin-grid" id="galleryAdminGrid"></div>
            </div>
            <section class="gallery-info-panel">
              <div>
                <p class="eyebrow">Media Details</p>
                <h2>图库图片</h2>
              </div>
              <form id="galleryForm" class="form-grid media-form">
                <label>所属章节<select name="chapter"></select></label>
                <label>图片路径<input name="src" readonly></label>
                <label>图片尺寸<input name="size" readonly></label>
                <label>排序<input name="order" type="number" min="0"></label>
                <label class="full">作品简述<textarea name="workSummary" rows="6" placeholder="用于前台图片弹窗的简短说明，可留空"></textarea></label>
                <label class="check"><input name="showInHeroWall" type="checkbox"> 在首屏动态展示</label>
                <label class="check"><input name="showOnHome" type="checkbox"> 在首页图库展示</label>
                <label class="check"><input name="showInChapterCover" type="checkbox"> 作为章节预览图</label>
                <label class="check"><input name="showInChapterStrip" type="checkbox"> 显示在章节右侧</label>
              </form>
              <div class="asset-tools">
                <button class="button ghost" id="copyGalleryPathBtn" type="button">复制图片路径</button>
                <button class="button ghost danger" id="deleteGalleryBtn" type="button">删除当前图片</button>
              </div>
            </section>
          </section>

          <div class="asset-tools" id="projectTools">
            <label class="button ghost file-pick">上传素材<input id="assetInput" type="file" accept="image/*" multiple></label>
            <button class="button ghost" id="removeAssetBtn" type="button">删除选中素材</button>
          </div>
          <div class="asset-tools" id="articleTools" hidden>
            <label class="button ghost file-pick">上传文章封面<input id="articleCoverInput" type="file" accept="image/*"></label>
            <button class="button ghost danger" id="deleteArticleBtn" type="button">删除文章</button>
          </div>
          <div class="asset-tools" id="settingsTools" hidden>
            <label class="button ghost file-pick">上传 Banner 大图<input id="heroImageInput" type="file" accept="image/*"></label>
            <label class="button ghost file-pick">上传微信二维码<input id="qrImageInput" type="file" accept="image/*"></label>
          </div>
          <div class="asset-grid" id="assetGrid"></div>
        </section>
      </main>
    </div>

    <script src="/admin.js?v=hero-intro-current"></script>
  </body>
</html>
