<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reference Draft - Portfolio</title>
    <link rel="stylesheet" href="/styles.css?v=button-orange">
  </head>
  <body class="ref-draft-page">
    <main class="ref-draft" id="refDraft">
      <header class="ref-header">
        <a class="ref-back" href="/" aria-label="返回当前版本">←</a>
        <div class="ref-brand-mark">B×P</div>
        <div class="ref-brand-copy">
          <p>Portfolio Reference Draft</p>
          <h1 id="refTitle">打造您的专属品牌</h1>
          <span id="refContact">Brand × Product Visual Designer</span>
        </div>
      </header>

      <section class="ref-hero" id="refHero">
        <div class="ref-hero-media" id="refHeroMedia"></div>
        <div class="ref-frame ref-frame-a">品牌系统</div>
        <div class="ref-frame ref-frame-b">产品营销</div>
        <div class="ref-frame ref-frame-c">商业视觉</div>
        <div class="ref-hero-copy">
          <p id="refHeroEyebrow">Graphic Designer Portfolio</p>
          <h2 id="refHeroName">MAKEDO</h2>
          <span id="refHeroIntro"></span>
        </div>
      </section>

      <section class="ref-panel ref-about" id="refAbout">
        <div>
          <p class="ref-kicker">为什么选择？</p>
          <h2 id="refAboutTitle">科技产品商业视觉设计师</h2>
          <p id="refAboutBody"></p>
        </div>
        <div class="ref-stat-grid" id="refStats"></div>
      </section>

      <section class="ref-stack" id="refChapters"></section>

      <section class="ref-panel ref-archive" id="refArchive">
        <div>
          <p class="ref-kicker">作品专栏</p>
          <h2 id="refArchiveTitle">图库精选</h2>
        </div>
        <div class="ref-mini-gallery" id="refMiniGallery"></div>
      </section>
    </main>

    <script src="/draft-reference.js"></script>
  </body>
</html>
