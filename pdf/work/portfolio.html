      gap: 18px;
      align-items: center;
    }

      height: 500px;

      background: #e9edf2;

      grid-template-columns: 1fr 1fr;
      gap: 28px;

    }
    .grid-3 {

      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-top: 34px;
    }
    .grid-4 {

      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-top: 28px;
    }

      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 30px;

      height: 132px;
      border: 1px solid rgba(255,255,255,.36);
      border-radius: 8px;

      right: 40px;

      padding: 24px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #dfe4ea;

      font-weight: 800;

      margin-top: 0;

function img(name, cls = "") {
  return `<img class="${cls}" src="${A + name}" alt="">`;
}
function list(items) {
  return `<ul>${items.map(i => `<li>${i}</li>`).join("")}</ul>`;
}
function footer(p, i) {
  const a = p.foot?.[0] || "Industrial Product Marketing Visual Designer";
  const b = p.foot?.[1] || String(i + 1).padStart(2, "0");
  return `<div class="footer"><span>${a}</span><span>${b}</span></div>`;
}
function card(title, body) {
  const content = Array.isArray(body) ? list(body) : `<p>${body}</p>`;
  return `<div class="card"><h3>${title}</h3>${content}</div>`;
}
function splitPage(p, stage, copy = "") {
  const text = copy || p.lead || p.note || "Selected works and project details.";
  return `<div class="split"><aside class="side"><div><div class="kicker">${p.kicker}</div><h2>${p.title}</h2><div class="side-rule"></div></div><p>${text}</p></aside><div class="stage">${stage}</div></div>`;
}
function render(p, i) {
  const cls = `page ${p.theme || "light"}`;
  let html = "";
  if (p.type === "hero") {
    html = `${img(p.img, "hero-img")}<div class="hero-layer"></div><div class="content"><div class="kicker">${p.kicker}</div><h1>${p.title}</h1><p class="lead">${p.lead}</p><div class="tag-row"><span class="tag">工业产品视觉</span><span class="tag">海外营销设计</span><span class="tag">AI视觉生成</span><span class="tag">多语言本地化视觉</span></div></div>`;
  } else if (p.type === "about") {
    html = splitPage(p, `<div class="compact-grid three">${p.cards.map(c => card(c[0], c[1])).join("")}</div>`, p.lead);
  } else if (p.type === "skillmap") {
    html = splitPage(p, `<div class="compact-grid four">${p.items.map(x => `<div class="skill-card" style="min-height:500px"><div class="icon-dot"></div><h3>${x[0]}</h3><p><strong>${x[1]}</strong></p><p style="margin-top:18px">${x[2]}</p></div>`).join("")}</div>`, "四类能力对应后续案例：品牌视觉、产品表达、AI 创意和多语言营销。");
  } else if (p.type === "caseCover") {
    html = `<div class="title-row"><div><div class="kicker">${p.kicker}</div><h2>${p.title}</h2><p class="lead">${p.lead}</p></div><div class="image-stack">${p.imgs.map(x => img(x, "poster")).join("")}</div></div>`;
  } else if (p.type === "challenge") {
    html = splitPage(p, `<div class="compact-grid">${p.cols.map(c => card(c[0], c[1])).join("")}</div>`, "先讲问题，再讲目标。让面试官看到设计不是堆图，而是围绕商业传播效率解决问题。");
  } else if (p.type === "strategy") {
    html = splitPage(p, `<div class="tag-row" style="margin-top:0">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div><div class="compact-grid three" style="margin-top:28px">${p.cards.map(c => card(c[0], c[1])).join("")}</div>`, "关键词、方向和色彩系统统一后，后续海报、场景和本地化版本才能形成品牌系统。");
  } else if (p.type === "posterSystem") {
    html = splitPage(p, `<div class="matrix tall">${p.imgs.map(x => img(x, "")).join("")}</div>`, p.note);
  } else if (p.type === "localization") {
    html = splitPage(p, `<div class="lang-row">${p.imgs.map((x, n) => `<div>${img(x, "")}<p class="small" style="margin-top:10px">${p.labels[n]}</p></div>`).join("")}</div>`, "同一视觉框架下适配不同语言版本，处理文本长度、阅读方向和版面重心。");
  } else if (p.type === "scenarios") {
    html = splitPage(p, `<div class="grid-6" style="margin-top:0">${p.items.map(x => `<div><div class="scene-box" style="min-height:155px"></div><h3 style="margin-top:12px;font-size:20px">${x}</h3></div>`).join("")}</div>`, "用真实工程场景增强产品可信度，让工业设备从参数展示进入应用叙事。");
  } else if (p.type === "workflow") {
    html = splitPage(p, `<div class="workflow" style="margin-top:0">${p.steps.map((s, n) => `<div class="step"><div class="big-number">0${n+1}</div><h3 style="margin-top:28px">${s}</h3></div>`).join("")}</div>`, p.note);
  } else if (p.type === "beforeAfter") {
    html = splitPage(p, `<div class="compare" style="margin-top:0"><div><div class="fake-before"></div><h3 style="margin-top:16px">Before</h3><p>普通产品图 / 信息层级弱 / 场景情绪不足</p></div><div>${img(p.img, "poster short")}<h3 style="margin-top:16px">After</h3><p>${p.note}</p></div></div>`, "前后对比直接体现设计价值：从普通产品信息，转化为高可信、高识别的营销视觉。");
  } else if (p.type === "section") {
    html = `<div class="content"><div class="kicker">${p.kicker}</div><h1>${p.title}</h1><p class="lead">${p.lead}</p></div><div class="band"></div>`;
  } else if (p.type === "sceneDetail") {
    html = splitPage(p, `<div class="compact-grid three">${p.items.map(x => `<div><div class="scene-box" style="min-height:360px"></div><h3 style="margin-top:16px">${x}</h3></div>`).join("")}</div>`, p.note);
  } else if (p.type === "style") {
    html = splitPage(p, `<div class="compact-grid four">${p.palettes.map(c => `<div class="card" style="height:430px;background:${c};border:0"></div>`).join("")}</div>`, p.note);
  } else if (p.type === "matrixPage") {
    html = splitPage(p, `<div class="work-matrix">${p.imgs.map(x => img(x, "")).join("")}</div>`, "精选作品矩阵集中展示工业产品海报、节日营销、多语言本地化与 AI 创意视觉。");
  } else if (p.type === "contact" || p.type === "end") {
    html = `<div class="content"><div class="kicker">${p.kicker}</div><h1>${p.title}</h1><p class="lead">${p.lead}</p><div class="tag-row"><span class="tag">Industrial Visual Design</span><span class="tag">Marketing Design</span><span class="tag">AI Creative Design</span></div></div>`;
  }
  return `<section class="${cls}">${html}${footer(p, i)}</section>`;
}

document.getElementById("deck").innerHTML = pages.map(render).join("");
</script>
</body>
</html>
